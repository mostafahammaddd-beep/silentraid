plugins { id 'com.android.application' }

// Firebase Analytics is enabled only when you add app/google-services.json (downloaded from the Firebase console).
// Without that file the app still builds and simply skips analytics.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.silentraid.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.silentraid.game'
        minSdk 24
        targetSdk 36
        versionCode 17
        versionName '1.0.17'
    }

    // ---- Signing: an APK that is NOT signed cannot be installed on a phone ("package appears to be invalid"). ----
    // 1) If you provide your own key (GitHub secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD,
    //    or a local keystore.p12 next to settings.gradle), the release APK is signed with YOUR key (use this for Google Play).
    // 2) Otherwise the release APK is signed with the bundled sideload key (app/sideload-keystore.p12) so it always installs.
    //    That key is public, so it is only for testing / direct installs - never publish a store build signed with it.
    def ksFile = System.getenv('KEYSTORE_PATH') ? file(System.getenv('KEYSTORE_PATH')) : file('../keystore.p12')
    def hasKeystore = ksFile.exists() && System.getenv('KEYSTORE_PASSWORD')

    signingConfigs {
        sideload {
            storeFile file('sideload-keystore.p12')
            storeType 'pkcs12'
            storePassword 'silentraid'
            keyAlias 'silentraid'
            keyPassword 'silentraid'
            enableV1Signing true
            enableV2Signing true
        }
        if (hasKeystore) {
            release {
                storeFile ksFile
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'silentraid'
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.sideload
        }
    }

    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'androidx.annotation:annotation:1.8.0'
}

// ---- Release safety: warn loudly if Google's TEST AdMob ids are still in strings.xml ----
tasks.configureEach { t ->
    if (t.name == 'assembleRelease' || t.name == 'bundleRelease') {
        t.doFirst {
            def strings = file('src/main/res/values/strings.xml').text
            if (strings.contains('ca-app-pub-3940256099942544')) {
                logger.warn('\n!!! WARNING: strings.xml still contains Google TEST AdMob ids. Replace admob_app_id and admob_rewarded_unit_id with YOUR ids before publishing. !!!\n')
            }
        }
    }
}
