name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check project layout
        shell: bash
        run: |
          set -euo pipefail
          test -f SilentRaid/settings.gradle
          echo "Project root: SilentRaid"
          ls -la SilentRaid

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # IMPORTANT: AGP 8.11.1 requires Gradle 8.13+. Pin the version here
      # so the runner cannot silently fall back to Ubuntu's Gradle 8.9.
      - name: Setup Gradle 8.13 (required by AGP 8.11.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test "$(gradle --version | awk '/Gradle / {print $2; exit}')" = "8.13"

      - name: Prepare signing key (from GitHub secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - the APK will be built UNSIGNED."
          fi

      - name: Check AdMob ids
        run: |
          if grep -q "ca-app-pub-3940256099942544" SilentRaid/app/src/main/res/values/strings.xml; then
            echo "::warning::AdMob TEST ids are still in strings.xml - replace them with your own before publishing."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle -p SilentRaid assembleRelease --no-daemon --stacktrace --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: SilentRaid-APK
          path: SilentRaid/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
